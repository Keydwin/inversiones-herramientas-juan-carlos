<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{{ base_dir }}/css/pdf_style.css">
    <meta charset="UTF-8">
    <title>Reporte de Puestos de Trabajo</title>
</head>
<body onload="window.print()">
    <h2>Reporte de Puestos de Trabajo {% if puesto_filtro %}({{ puesto_filtro }}){% endif %}</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Puesto</th>
                <th>Sueldo</th>
            </tr>
        </thead>
        <tbody>
            {% for p in workstations %}
            <tr>
                <td>{{ p.id }}</td>
                <td>{{ p.NombrePuestoTrabajo }}</td>
                <td>{{ p.Sueldo }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center;">No se encontraron registros</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="no-print" style="text-align: center; margin-top: 30px;">
        <button class="btn btn-print" onclick="window.print()" style="padding: 8px 16px; margin: 0 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background-color: #007bff; color: white;">Imprimir / Guardar PDF</button>
        <button class="btn btn-close" onclick="window.close()" style="padding: 8px 16px; margin: 0 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background-color: #6c757d; color: white;">Cerrar pestaña</button>
    </div>
    
</body>
</html>
