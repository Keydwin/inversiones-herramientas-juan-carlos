<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{{ base_dir }}/css/pdf_style.css">
    <meta charset="UTF-8">
    <title>Reporte de Puestos de Trabajo</title>
</head>
<body>

    <table class="header-table">
        <tr>
            <td>
                <div class="title">Inversiones Herramientas Juan Carlos</div>
                <div class="subtitle">Reporte de Puestos de Trabajo</div>
            </td>
        </tr>
    </table>

    <table class="data-table">
        <thead>
            <tr>
                <th>Nombre del Puesto</th>
                <th>Sueldo</th>
            </tr>
        </thead>
        <tbody>
            {% for position in positions %}
            <tr>
                <td>{{ position.NombrePuestoTrabajo|trim }}</td>
                <td>{{ "%.2f"|format(position.Sueldo) }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" style="text-align: center;">No hay puestos de trabajo registrados</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div id="footer_content">
        Página <pdf:pagenumber> de <pdf:pagecount>
    </div>

</body>
</html>
