<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-box">
            <div class="logo-container">
                <h2>Iniciar Sesión</h2>
            </div>
            
            <form id="loginForm" method="POST">
                <div class="input-group">
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresar Usuario">
                </div>

                <div class="input-group">
                    <input type="password" id="contraseña" name="contraseña" placeholder="Ingresar Contraseña">
                </div>

                <p class="error" id="errorMsg"></p>
                
                <button type="submit">Entrar</button>
                
            </form>
        </div>
    </div>
</body>
</html>
